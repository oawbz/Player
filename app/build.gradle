plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
def api18 = providers.gradleProperty("api18").map { it.toBoolean() }.getOrElse(false)
def mediaVersion = api18 ? "1.2.1" : "1.8.0"
android {
    namespace 'cn.awbz.davplayer'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'cn.awbz.davplayer'
        minSdk (api18 ? 18 : 23)
        targetSdk 33
        versionCode 66
        versionName (api18 ? '0.4.8-api18' : '0.4.8')
        multiDexEnabled api18
    }
    buildFeatures { viewBinding true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions { jvmTarget = '11' }
    signingConfigs { debug { enableV1Signing true; enableV2Signing true } }
    buildTypes {
        release { minifyEnabled false }
        // Local manual-test package: same existing signing identity, no debugger flag.
        preview {
            initWith release
            debuggable false
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    implementation project(api18 ? ':media3-ffmpeg-api18' : ':media3-ffmpeg')
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation "androidx.media3:media3-exoplayer:$mediaVersion"
    implementation "androidx.media3:media3-exoplayer-hls:$mediaVersion"
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:3.12.13'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
}
